name: Deploy Migrations to Dev

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Versión fija: "latest" resuelve via API de GitHub sin token y truena
          # con "rate limit exceeded" en runners compartidos.
          version: 2.105.0

      - name: Instalar cliente PostgreSQL
        run: sudo apt-get install -y postgresql-client -q

      - name: Sincronizar historial de migraciones
        env:
          PGSSLMODE: disable
        run: |
          psql "${{ secrets.DEV_DB_URL }}" <<'SQL'
            DELETE FROM supabase_migrations.schema_migrations
            WHERE version < '20260513000000';

            INSERT INTO supabase_migrations.schema_migrations (version)
            VALUES ('20260513000000'), ('20260513000001'),
                   ('20260513000002'), ('20260513000003')
            ON CONFLICT (version) DO NOTHING;
          SQL

      - name: Verificar prefijos de migracion unicos
        # Los 14 digitos del nombre son la `version` y la PK de
        # supabase_migrations.schema_migrations. Dos archivos con el mismo prefijo rompen el
        # deploy del segundo, y peor: el CLI toma solo uno de ellos, asi que el otro queda
        # IGNORADO EN SILENCIO y su SQL nunca se aplica. Ha pasado tres veces (2026-08-12,
        # 2026-08-17 y 2026-08-18), siempre porque dos PR abiertos a la vez eligieron la
        # misma hora redonda. Verificarlo antes de abrir el PR no basta: la colision aparece
        # al mergear. Aqui se detecta en segundos y con un mensaje claro.
        run: |
          dups=$(ls supabase/migrations/*.sql | sed 's|.*/||' | cut -c1-14 | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::Prefijos de migracion duplicados: $dups"
            for d in $dups; do
              echo "  $d ->"
              ls supabase/migrations/${d}_*.sql | sed 's|.*/|    |'
            done
            echo "Renombrar uno de los archivos a una hora libre y reintentar."
            exit 1
          fi
          echo "Sin prefijos duplicados."

      - name: Deploy migrations to dev
        env:
          PGSSLMODE: disable
        # --include-all: aplica migraciones out-of-order (versiones con timestamp
        # anterior al último aplicado en remoto). Necesario cuando dev y prod
        # divergen en qué migraciones tienen (p.ej. una recuperada de drift con
        # timestamp previo al último deploy).
        run: supabase db push --db-url "${{ secrets.DEV_DB_URL }}" --include-all

      - name: Autenticar a Google Cloud (Firestore)
        if: always()
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_GCP_DEV }}

      - name: Configurar gcloud
        if: always()
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      - name: Notificar deploy listo (WhatsApp)
        if: always()
        continue-on-error: true
        env:
          ENVIRONMENT: DEV
          STATUS: ${{ job.status }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRESTORE_PROJECT: sozu-admin-dev
          N8N_WEBHOOK: https://automatizacion-n8n.fbqqbe.easypanel.host/webhook/manda_notificacion
          N8N_APIKEY: 80FA62E3FD0C-4477-8B31-8A2CD6AF7B57
        run: bash ci/notify-deploy.sh
