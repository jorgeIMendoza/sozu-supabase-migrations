# Notifica por WhatsApp sobre PRs:
#   - Abierto hacia `dev`  -> avisa al admin (comportamiento original).
#   - Cerrado (con o sin merge) hacia `dev` o `main` -> avisa al AUTOR del PR
#     (teléfono en Firestore contributors/{login}.telefonoWhatsapp) y al admin.
#
# Colocar este archivo como `.github/workflows/notify-pr-dev.yml` en CADA repo
# monitoreado:
#   - jorgeIMendoza/sozu-cliente-app
#   - jorgeIMendoza/sozu-admin
#   - jorgeIMendoza/sozu-supabase-migrations
#   - jorgeIMendoza/sozu-edge-functions
#   - jorgeIMendoza/sozu-n8n-workflows
#   - jorgeIMendoza/sozu-mcp
#   - sozu-com/server-stp
#
# La instancia, el webhook, la apikey y el teléfono del admin YA NO se escriben
# aquí: salen ÚNICAMENTE de la configuración de la EMPRESA dueña del repo
# (dashboard → Configuración → Notificaciones). No hay default global ni
# herencia: o la empresa está configurada, o no se manda nada. Ver el bloque
# `RESOLVER_WA` de abajo y `ci-templates/README.md`.
#
# El aviso al admin y el aviso a los autores van en JOBS SEPARADOS, y ninguno
# usa actions del marketplace: el 2026-08-06 un "Service Unavailable" al
# resolver `google-github-actions/auth` tumbó el job entero en la fase de setup
# (antes de cualquier step, así que `continue-on-error` no sirvió de nada) y el
# merge a dev de un PR no notificó a nadie. Ahora el token de Google se pide
# firmando un JWT con openssl — solo curl, jq y openssl, ya presentes en el
# runner — y un fallo al resolver teléfonos no puede impedir el aviso al admin.

name: Notificar PR (WhatsApp)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
    branches: [dev, main]

env:
  # Proyecto de Firestore donde viven la configuración y los teléfonos.
  FIRESTORE_PROJECT: sozu-admin-dev

  # ---------------------------------------------------------------------------
  # Bloque reutilizable de resolución de la configuración de WhatsApp.
  #
  # Se guarda como texto en una variable de entorno del workflow (en lugar de en
  # una composite action) para escribirlo UNA sola vez y correrlo en los tres
  # jobs con `bash -c "$RESOLVER_WA"`, sin agregar actions de terceros ni
  # dependencias entre jobs: cada job sigue resolviendo lo suyo por su cuenta y
  # el aviso al admin no depende de nadie más.
  #
  # Exporta a $GITHUB_ENV:
  #   WA_INSTANCE  instancia de WhatsApp en n8n (el `instanciaWA` del payload)
  #   WA_WEBHOOK   webhook de n8n al que se postea
  #   WA_APIKEY    apikey del webhook (enmascarada con ::add-mask:: al leerla)
  #   WA_ADMIN     teléfono que recibe los avisos administrativos (E.164)
  #   WA_ENABLED   "true" solo si la empresa está configurada Y no apagó los
  #                avisos; con cualquier otro valor NO se manda nada
  #   WA_MOTIVO    por qué no se manda, para que el step de envío lo imprima
  #   WA_GCP_TOKEN access token de Google, para reusarlo en el mismo job
  #
  # TODO ES POR EMPRESA O NO SE MANDA NADA: se lee la empresa dueña del repo y
  # solo sus documentos. Ya no hay `settings/notifications` ni `secrets/whatsapp`
  # globales, ni cascada que herede de ellos, porque con un default global la
  # empresa que todavía no configuraba sus avisos los recibía por el número de
  # otra, y su webhook podía acabar llevándose una llave que no era suya. Sin
  # nada que heredar, esos dos problemas desaparecen.
  #
  # Un repo sin empresa configurada NO es un error de CI: se explica en el log y
  # los steps de envío salen con `exit 0`, para no pintar en rojo los checks de
  # cada PR de un repo que simplemente no tiene avisos dados de alta.
  # ---------------------------------------------------------------------------
  RESOLVER_WA: |
    # --- Access token de Google (JWT firmado con openssl) --------------------
    # Antes esto lo hacían google-github-actions/auth + setup-gcloud; se
    # quitaron porque su resolución en el setup del job es un punto de fallo que
    # se lleva por delante todo el workflow.
    b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
    CLIENT_EMAIL="$(printf '%s' "$SA_JSON" | jq -r '.client_email // empty')"
    PRIVATE_KEY="$(printf '%s' "$SA_JSON" | jq -r '.private_key // empty')"
    ACCESS_TOKEN=""
    if [ -n "$CLIENT_EMAIL" ] && [ -n "$PRIVATE_KEY" ]; then
      IAT="$(date +%s)"; EXP="$((IAT + 3600))"
      HEADER="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
      CLAIM="$(jq -nc --arg iss "$CLIENT_EMAIL" --argjson iat "$IAT" --argjson exp "$EXP" \
        '{iss:$iss,scope:"https://www.googleapis.com/auth/datastore",aud:"https://oauth2.googleapis.com/token",iat:$iat,exp:$exp}' \
        | b64url)"
      # La llave va a un archivo con permisos 600 (no a un process substitution:
      # openssl no siempre puede abrir /dev/fd).
      KEYFILE="$(mktemp)"; chmod 600 "$KEYFILE"
      printf '%s' "$PRIVATE_KEY" > "$KEYFILE"
      SIG="$(printf '%s.%s' "$HEADER" "$CLAIM" \
        | openssl dgst -sha256 -sign "$KEYFILE" -binary | b64url)"
      rm -f "$KEYFILE"
      ACCESS_TOKEN="$(curl -s --max-time 20 -X POST https://oauth2.googleapis.com/token \
        -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
        --data-urlencode "assertion=${HEADER}.${CLAIM}.${SIG}" \
        | jq -r '.access_token // empty')"
    fi
    if [ -z "$ACCESS_TOKEN" ]; then
      echo "::error::Sin token de Google: no se puede leer la configuración de notificaciones en Firestore"
      exit 1
    fi
    echo "::add-mask::${ACCESS_TOKEN}"

    # --- Helpers de lectura por REST (el token del service account ignora las
    # reglas de seguridad) ----------------------------------------------------
    FS="https://firestore.googleapis.com/v1/projects/${FIRESTORE_PROJECT}/databases/(default)/documents"
    leer() { curl -s --max-time 20 -H "Authorization: Bearer $ACCESS_TOKEN" "${FS}/$1"; }
    campo() { printf '%s' "$1" | jq -r --arg f "$2" '.fields[$f].stringValue // empty'; }
    # `enabled` ausente = prendido. Ojo: `// empty` no sirve para booleanos
    # (jq trata `false` como vacío), por eso se mira el tipo del campo.
    prendido() { printf '%s' "$1" | jq -r 'if (.fields.enabled | type) == "object" then (.fields.enabled.booleanValue | tostring) else "" end'; }

    # --- Empresa dueña del repo ----------------------------------------------
    # repos/{owner__repo}.projectId -> projects/{projectId}.clientId
    # Sin empresa no hay a quién ni por dónde notificar: ya no queda ningún
    # default global del que tirar (y menos mal: era el que mandaba los avisos
    # de una empresa por el número de otra).
    REPO_ID="${GITHUB_REPOSITORY/\//__}"
    CLIENT_ID=""
    WA_MOTIVO=""
    PROJECT_ID="$(campo "$(leer "repos/${REPO_ID}")" projectId)"
    if [ -z "$PROJECT_ID" ]; then
      WA_MOTIVO="El repo '${GITHUB_REPOSITORY}' no está dado de alta en el dashboard (repos/${REPO_ID}), así que no se sabe de qué empresa es."
    else
      CLIENT_ID="$(campo "$(leer "projects/${PROJECT_ID}")" clientId)"
      if [ -z "$CLIENT_ID" ]; then
        WA_MOTIVO="El proyecto '${PROJECT_ID}' no tiene empresa asignada. Asígnale una en el dashboard → Proyectos."
      else
        echo "Empresa dueña del repo: '${CLIENT_ID}' (proyecto '${PROJECT_ID}')."
      fi
    fi

    # --- Configuración de la empresa (la única que hay) ----------------------
    C_DOC=""
    C_KEY=""
    if [ -n "$CLIENT_ID" ]; then
      C_DOC="$(leer "clients/${CLIENT_ID}/private/notifications")"
      C_KEY="$(campo "$(leer "clients/${CLIENT_ID}/private/whatsappSecret")" apiKey)"
      if [ -n "$C_KEY" ]; then echo "::add-mask::${C_KEY}"; fi
    fi

    WA_INSTANCE="$(campo "$C_DOC" instance)"
    WA_WEBHOOK="$(campo "$C_DOC" webhookUrl)"
    WA_ADMIN="$(campo "$C_DOC" adminPhone)"
    WA_APIKEY="$C_KEY"

    # `enabled: false` de la empresa apaga sus avisos; ausente = prendido.
    WA_ENABLED=true
    if [ -n "$WA_MOTIVO" ]; then
      WA_ENABLED=false
    elif [ "$(prendido "$C_DOC")" = "false" ]; then
      WA_ENABLED=false
      WA_MOTIVO="La empresa '${CLIENT_ID}' tiene apagadas las notificaciones de WhatsApp."
    else
      # Se enumera lo que falta, no un genérico: quien lea el log tiene que
      # saber qué campo ir a capturar. El webhook y la apikey ya no pueden
      # venir de dueños distintos, así que no hay nada que emparejar.
      FALTAN=""
      if [ -z "$WA_INSTANCE" ]; then FALTAN="${FALTAN}instancia, "; fi
      if [ -z "$WA_WEBHOOK" ];  then FALTAN="${FALTAN}webhook, ";   fi
      if [ -z "$WA_APIKEY" ];   then FALTAN="${FALTAN}apikey, ";    fi
      if [ -n "$FALTAN" ]; then
        WA_ENABLED=false
        WA_MOTIVO="La empresa '${CLIENT_ID}' no tiene ${FALTAN%, } de WhatsApp. Captúralo en el dashboard → Configuración → Notificaciones."
      fi
    fi

    # --- Exportar al resto de los steps (nunca se imprime la apikey) ----------
    exportar() { printf '%s=%s\n' "$1" "$(printf '%s' "$2" | tr -d '\r\n')" >> "$GITHUB_ENV"; }
    exportar WA_INSTANCE "$WA_INSTANCE"
    exportar WA_WEBHOOK  "$WA_WEBHOOK"
    exportar WA_APIKEY   "$WA_APIKEY"
    exportar WA_ADMIN    "$WA_ADMIN"
    exportar WA_ENABLED  "$WA_ENABLED"
    exportar WA_MOTIVO   "$WA_MOTIVO"
    exportar WA_GCP_TOKEN "$ACCESS_TOKEN"

    if [ -n "$WA_APIKEY" ]; then HAY_KEY="sí"; else HAY_KEY="NO"; fi
    echo "Empresa: '${CLIENT_ID}' | instancia: '${WA_INSTANCE}' | webhook: '${WA_WEBHOOK}' | apikey: ${HAY_KEY} | activas: ${WA_ENABLED}"

    # Que una empresa no esté configurada no es un error de CI: se dice y ya.
    # Fallar aquí pintaría en rojo el check de CADA PR de ese repo.
    if [ "$WA_ENABLED" != "true" ]; then
      echo "No se enviará ninguna notificación de WhatsApp. ${WA_MOTIVO}"
    fi

jobs:
  notify-abierto:
    # Solo PRs abiertos hacia dev (igual que antes)
    if: github.event.action != 'closed' && github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolver configuración de WhatsApp (empresa dueña del repo)
        env:
          SA_JSON: ${{ secrets.FIREBASE_GCP_DEV }}
        run: bash -c "$RESOLVER_WA"

      - name: Enviar WhatsApp (admin)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.number }}
          REPO_FULL: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
          ACTOR: ${{ github.actor }}
        run: |
          # Empresa sin configurar (o con los avisos apagados) no notifica, y no
          # es un fallo de CI: se sale en verde para no ensuciar el check del PR.
          if [ "$WA_ENABLED" != "true" ]; then
            echo "No se envía nada. ${WA_MOTIVO:-Notificaciones de WhatsApp no configuradas para esta empresa.}"
            exit 0
          fi
          if [ -z "$WA_ADMIN" ]; then
            echo "La empresa no tiene teléfono administrativo configurado (dashboard → Configuración → Notificaciones); no se envía el aviso al admin."
            exit 0
          fi
          # Detectar TODOS los autores reales desde el body (una línea
          # <!-- pr_author: login --> por autor; el dashboard las embebe).
          PR_BODY="$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO_FULL}/pulls/${PR_NUM}" \
            | jq -r '.body // ""')"
          AUTORES="$(printf '%s' "$PR_BODY" \
            | grep -oP '(?<=<!-- pr_author: )[\w.-]+(?= -->)' 2>/dev/null | sort -u | paste -sd ', ' || true)"
          AUTOR="${AUTORES:-$ACTOR}"
          MSG="Hay un PR para DEV del repo: ${REPO_NAME}, cambios de: ${AUTOR}"
          PAYLOAD="$(jq -n --arg tel "$WA_ADMIN" --arg msg "$MSG" --arg inst "$WA_INSTANCE" \
            '{tipo:"wa",telefono:$tel,mensajeWA:$msg,instanciaWA:$inst}')"
          # Reintentos: si n8n no responde a la primera, el aviso se pierde sin
          # dejar rastro. Tres intentos y el job falla si ninguno entra.
          for intento in 1 2 3; do
            CODE="$(curl -s -o /tmp/n8n.out -w '%{http_code}' --max-time 20 \
              -X POST "$WA_WEBHOOK" -H "apikey: $WA_APIKEY" \
              -H "Content-Type: application/json" -d "$PAYLOAD" || echo 000)"
            case "$CODE" in 2*) echo "Notificado admin"; exit 0 ;; esac
            echo "Intento ${intento} falló (HTTP ${CODE}): $(cat /tmp/n8n.out)"
            sleep $((intento * 5))
          done
          echo "::error::No se pudo notificar al admin tras 3 intentos"
          exit 1

  notify-cerrado-admin:
    # PR cerrado (mergeado o no) hacia dev o main -> avisa al admin.
    # Job aparte y sin dependencias: es el aviso que nunca debe perderse.
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolver configuración de WhatsApp (empresa dueña del repo)
        env:
          SA_JSON: ${{ secrets.FIREBASE_GCP_DEV }}
        run: bash -c "$RESOLVER_WA"

      - name: Enviar WhatsApp (admin)
        env:
          PR_NUM: ${{ github.event.number }}
          MERGED: ${{ github.event.pull_request.merged }}
          BASE: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.event.repository.name }}
          CERRADO_POR: ${{ github.actor }}
        run: |
          # Empresa sin configurar (o con los avisos apagados) no notifica, y no
          # es un fallo de CI: se sale en verde para no ensuciar el check del PR.
          if [ "$WA_ENABLED" != "true" ]; then
            echo "No se envía nada. ${WA_MOTIVO:-Notificaciones de WhatsApp no configuradas para esta empresa.}"
            exit 0
          fi
          if [ -z "$WA_ADMIN" ]; then
            echo "La empresa no tiene teléfono administrativo configurado (dashboard → Configuración → Notificaciones); no se envía el aviso al admin."
            exit 0
          fi
          if [ "$MERGED" = "true" ]; then
            MSG="El PR #${PR_NUM} del repo ${REPO} fue MERGEADO a ${BASE} por ${CERRADO_POR}"
          else
            MSG="El PR #${PR_NUM} del repo ${REPO} (hacia ${BASE}) fue CERRADO sin merge por ${CERRADO_POR}"
          fi
          PAYLOAD="$(jq -n --arg tel "$WA_ADMIN" --arg msg "$MSG" --arg inst "$WA_INSTANCE" \
            '{tipo:"wa",telefono:$tel,mensajeWA:$msg,instanciaWA:$inst}')"
          for intento in 1 2 3; do
            CODE="$(curl -s -o /tmp/n8n.out -w '%{http_code}' --max-time 20 \
              -X POST "$WA_WEBHOOK" -H "apikey: $WA_APIKEY" \
              -H "Content-Type: application/json" -d "$PAYLOAD" || echo 000)"
            case "$CODE" in 2*) echo "Notificado admin"; exit 0 ;; esac
            echo "Intento ${intento} falló (HTTP ${CODE}): $(cat /tmp/n8n.out)"
            sleep $((intento * 5))
          done
          echo "::error::No se pudo notificar al admin tras 3 intentos"
          exit 1

  notify-cerrado-autores:
    # PR cerrado -> avisa a CADA autor real del PR, con su teléfono de Firestore.
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolver configuración de WhatsApp (empresa dueña del repo)
        env:
          SA_JSON: ${{ secrets.FIREBASE_GCP_DEV }}
        run: bash -c "$RESOLVER_WA"

      - name: Enviar WhatsApp (autores del PR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOR_PR: ${{ github.event.pull_request.user.login }}
          PR_NUM: ${{ github.event.number }}
          MERGED: ${{ github.event.pull_request.merged }}
          BASE: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
          CERRADO_POR: ${{ github.actor }}
        run: |
          # Empresa sin configurar (o con los avisos apagados) no notifica, y no
          # es un fallo de CI: se sale en verde para no ensuciar el check del PR.
          if [ "$WA_ENABLED" != "true" ]; then
            echo "No se envía nada. ${WA_MOTIVO:-Notificaciones de WhatsApp no configuradas para esta empresa.}"
            exit 0
          fi
          # Detectar TODOS los autores reales: líneas <!-- pr_author: login -->
          # del body (una por autor; el dashboard las embebe según los commits).
          PR_BODY="$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO_FULL}/pulls/${PR_NUM}" \
            | jq -r '.body // ""')"
          AUTORES="$(printf '%s' "$PR_BODY" \
            | grep -oP '(?<=<!-- pr_author: )[\w.-]+(?= -->)' 2>/dev/null | sort -u || true)"
          if [ -z "$AUTORES" ]; then AUTORES="$AUTOR_PR"; fi
          echo "Autores a notificar: $(echo "$AUTORES" | paste -sd ', ')"

          if [ "$MERGED" = "true" ]; then
            MSG="Tu PR #${PR_NUM} del repo ${REPO} fue MERGEADO a ${BASE} por ${CERRADO_POR}"
          else
            MSG="Tu PR #${PR_NUM} del repo ${REPO} (hacia ${BASE}) fue CERRADO sin merge por ${CERRADO_POR}"
          fi

          # El access token ya lo obtuvo el step de resolución (mismo JWT firmado
          # con openssl); aquí solo se reusa para leer los teléfonos.
          ACCESS_TOKEN="${WA_GCP_TOKEN:-}"
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::warning::Sin token de Google: no se pueden leer los teléfonos de Firestore"
          fi

          send() {
            PAYLOAD="$(jq -n --arg tel "$1" --arg msg "$MSG" --arg inst "$WA_INSTANCE" \
              '{tipo:"wa",telefono:$tel,mensajeWA:$msg,instanciaWA:$inst}')"
            for intento in 1 2 3; do
              CODE="$(curl -s -o /tmp/n8n.out -w '%{http_code}' --max-time 20 \
                -X POST "$WA_WEBHOOK" -H "apikey: $WA_APIKEY" \
                -H "Content-Type: application/json" -d "$PAYLOAD" || echo 000)"
              case "$CODE" in 2*) return 0 ;; esac
              echo "Intento ${intento} falló (HTTP ${CODE}): $(cat /tmp/n8n.out)"
              sleep $((intento * 5))
            done
            return 1
          }

          FALLOS=0
          while IFS= read -r AUTOR; do
            [ -z "$AUTOR" ] && continue
            PHONE=""
            if [ -n "$ACCESS_TOKEN" ]; then
              PHONE="$(curl -s --max-time 20 -H "Authorization: Bearer $ACCESS_TOKEN" \
                "https://firestore.googleapis.com/v1/projects/${FIRESTORE_PROJECT}/databases/(default)/documents/contributors/${AUTOR}" \
                | jq -r '.fields.telefonoWhatsapp.stringValue // empty')"
            fi
            if [ -z "$PHONE" ]; then
              echo "::warning::Sin teléfono guardado para '${AUTOR}'; se omite. Agrégalo en la pestaña Contribuidores."
              continue
            fi
            if send "+521${PHONE}"; then
              echo "Notificado autor ${AUTOR}"
            else
              echo "::error::No se pudo notificar a ${AUTOR} tras 3 intentos"
              FALLOS=$((FALLOS + 1))
            fi
          done <<< "$AUTORES"
          exit "$FALLOS"
